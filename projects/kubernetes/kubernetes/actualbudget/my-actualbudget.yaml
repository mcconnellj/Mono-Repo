---
# Source: actualbudget/templates/serviceaccount.yaml
apiVersion: v1
kind: ServiceAccount
metadata:
  name: my-actualbudget
  labels:
    helm.sh/chart: actualbudget-1.8.0
    app.kubernetes.io/name: actualbudget
    app.kubernetes.io/instance: my-actualbudget
    app.kubernetes.io/version: "25.7.1"
    app.kubernetes.io/managed-by: Helm
automountServiceAccountToken: true
---
# Source: actualbudget/templates/service.yaml
apiVersion: v1
kind: Service
metadata:
  name: my-actualbudget
  labels:
    helm.sh/chart: actualbudget-1.8.0
    app.kubernetes.io/name: actualbudget
    app.kubernetes.io/instance: my-actualbudget
    app.kubernetes.io/version: "25.7.1"
    app.kubernetes.io/managed-by: Helm
spec:
  type: ClusterIP
  ports:
    - port: 5006
      targetPort: http
      protocol: TCP
      name: http
